<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTDoc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // 首帧前定主题，避免深色用户看到白屏闪一下（与 src/ui/app.ts 的 applyTheme 同一套规则）
      (function () {
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem('ptdoc.prefs') || '{}');
        } catch (e) {}
        var mode = prefs.theme || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到编辑器</a>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
      <symbol id="i-sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l1.41-1.41a5 5 0 0 0-7.07-7.07L10 5.93" />
        <path d="M14 11a5 5 0 0 0-7.07 0L5.52 12.41a5 5 0 0 0 7.07 7.07L14 18.07" />
      </symbol>
      <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
        <path d="M14 3v5h5" />
      </symbol>
      <symbol id="i-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-15.5-6.3" />
        <path d="M5.5 5.7V9H9" />
        <path d="M3 12a9 9 0 0 0 15.5 6.3" />
        <path d="M18.5 18.3V15H15" />
      </symbol>
      <symbol id="i-contrast" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
      </symbol>
    </svg>
    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="icon-btn" type="button" title="折叠侧边栏" aria-label="折叠侧边栏" aria-controls="sidebar" aria-expanded="true">
            <svg class="icon"><use href="#i-sidebar"></use></svg>
          </button>
          <div class="brand" id="brand">PTDoc</div>
          <nav class="nav-tabs" role="tablist" aria-label="主导航">
            <button type="button" role="tab" data-nav="view" class="active" aria-selected="true">视图</button>
            <button type="button" role="tab" data-nav="search" aria-selected="false">检索</button>
            <button type="button" role="tab" data-nav="scene" aria-selected="false">场景</button>
            <button type="button" role="tab" data-nav="integration" aria-selected="false">集成</button>
          </nav>
          <div class="doc-meta">
            <span id="doc-title" class="doc-title">未命名</span>
            <span id="doc-source" class="doc-source" hidden></span>
          </div>
        </div>
        <div class="view-switch" role="tablist" aria-label="编辑视图">
          <button id="view-edit" type="button" role="tab" aria-selected="false" data-view="edit">编辑</button>
          <button id="view-split" type="button" role="tab" aria-selected="true" data-view="split" class="active">分栏</button>
          <button id="view-preview" type="button" role="tab" aria-selected="false" data-view="preview">预览</button>
        </div>
        <div class="actions">
          <div class="action-group">
            <button id="open-md" type="button">打开</button>
            <button id="upload-img" type="button">上传图片</button>
          </div>
          <div class="action-group">
            <button id="share" class="btn-primary" type="button">生成分享版<span id="share-badge" class="share-badge" hidden></span></button>
          </div>
          <div class="action-group action-secondary" id="action-secondary">
            <button id="toc-toggle" type="button">目录</button>
            <button id="snapshots" type="button">快照</button>
          </div>
          <details id="more-menu" class="menu">
            <summary>更多</summary>
            <div class="menu-list" id="more-list"></div>
          </details>
          <div class="action-group action-account">
            <button id="history" type="button" hidden>历史</button>
            <button id="theme-toggle" class="icon-btn" type="button" title="外观：跟随系统（点击切换）" aria-label="切换外观">
              <svg class="icon"><use href="#i-contrast"></use></svg>
            </button>
            <span id="whoami" class="whoami" hidden></span>
            <button id="logout" type="button" hidden>退出</button>
          </div>
        </div>
        <input type="file" id="md-input" accept=".md,.markdown" hidden />
        <input type="file" id="img-input" accept="image/*" hidden />
        <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
      </header>
      <div class="workspace" id="workspace">
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
        <aside id="sidebar" class="sidebar">
          <div class="sider-page active" data-page="docs">
            <div class="sidebar-head">
              <input id="sidebar-search" type="search" placeholder="过滤文档…" aria-label="过滤文档" />
              <button id="sidebar-new" class="icon-btn" type="button" title="新建文档" aria-label="新建文档">
                <svg class="icon"><use href="#i-plus"></use></svg>
              </button>
              <button id="sidebar-import" class="icon-btn" type="button" title="导入文件夹" aria-label="导入文件夹">
                <svg class="icon"><use href="#i-folder"></use></svg>
              </button>
            </div>
            <nav id="sidebar-tree" class="sidebar-tree" aria-label="文档树"></nav>
          </div>
          <div class="sider-page" data-page="archive">
            <div class="sidebar-head">
              <input id="archive-search" type="search" placeholder="过滤归档…" aria-label="过滤归档" />
              <button id="archive-new-folder" class="icon-btn" type="button" title="新建文件夹" aria-label="新建文件夹">
                <svg class="icon"><use href="#i-plus"></use></svg>
              </button>
            </div>
            <nav id="archive-tree" class="sidebar-tree" aria-label="归档树"></nav>
          </div>
          <div class="sider-page" data-page="agent">
            <section class="nav-group">
              <div class="nav-group-head"><span>智能体场景</span></div>
              <nav class="nav-menu">
                <button type="button" data-agent-scene="qa" class="active">知识库问答 <span class="nav-count" data-count="qa">0</span></button>
                <button type="button" data-agent-scene="writer">文档编写 <span class="nav-count" data-count="writer">0</span></button>
              </nav>
            </section>
            <section class="nav-group">
              <div class="nav-group-head">
                <span>会话</span>
                <button id="agent-new-nav" type="button">新对话</button>
              </div>
              <ul id="nav-convs" class="history-list"></ul>
            </section>
            <div class="sider-note">会话状态（可观测/草稿）展示在右侧工作区。</div>
          </div>
          <div class="sider-page" data-page="share">
            <nav class="nav-menu">
              <button class="share-media-btn" type="button">媒体库</button>
            </nav>
            <div class="sider-note">发布/分享操作在编辑器顶栏「生成分享版」；产物管理见「归档」页。</div>
          </div>
          <div class="sider-page" data-page="settings">
            <div class="nav-group">
              <div class="nav-group-head"><span>配置项</span></div>
              <nav class="nav-menu">
                <button type="button" data-settings-section="storage">对象存储 <span class="settings-dot mini" data-nav-dot="storage"></span></button>
                <button type="button" data-settings-section="llm">大模型 <span class="settings-dot mini" data-nav-dot="llm"></span></button>
                <button type="button" data-settings-section="qdrant">知识库 <span class="settings-dot mini" data-nav-dot="qdrant"></span></button>
                <button type="button" data-settings-section="token">API Token <span class="settings-dot mini" data-nav-dot="token"></span></button>
              </nav>
            </div>
            <div class="nav-group">
              <div class="nav-group-head"><span>账号</span></div>
              <nav class="nav-menu">
                <button type="button" data-settings-section="password">修改密码</button>
                <button id="admin" type="button" hidden>平台管理</button>
              </nav>
            </div>
          </div>
        </aside>
        <div class="main-pages">
          <!-- 文档工作台（文档 / 归档两个 Tab 共用） -->
          <section class="main-page active" data-main="docs">
            <div class="workspace-main">
              <section class="pane editor-pane">
                <textarea id="editor" spellcheck="false" placeholder="在这里写 Markdown，支持 ```mermaid 代码块…"></textarea>
              </section>
              <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical" aria-label="调整编辑与预览宽度"></div>
              <section class="pane preview-pane">
                <article id="preview" class="markdown-body"></article>
              </section>
            </div>
          </section>
          <!-- 智能体主界面（Sider = 会话导航，这里 = 会话工作区） -->
          <section class="main-page" data-main="agent">
            <div class="agent-page">
              <div class="agent-tabs">
                <button type="button" data-scene="qa" class="active">知识库问答</button>
                <button type="button" data-scene="writer">文档编写</button>
              </div>
              <div class="agent-body">
                <section class="agent-main">
                  <div id="agent-msgs" class="agent-msgs"></div>
                  <div id="agent-draft" class="agent-draft" hidden>
                    <span>草稿已生成</span>
                    <button type="button" id="draft-current">写入当前文档</button>
                    <button type="button" id="draft-new">另存为新文档</button>
                    <button type="button" id="draft-cancel">取消</button>
                  </div>
                  <div class="agent-input">
                    <textarea id="agent-text" rows="3" placeholder="输入问题或编写指令"></textarea>
                    <div class="agent-ops">
                      <button type="button" id="agent-send">发送</button>
                      <button type="button" id="agent-stop">停止</button>
                      <button type="button" id="agent-retrieve" hidden>补充检索</button>
                    </div>
                  </div>
                </section>
                <aside class="agent-obs">
                  <h4>可观测</h4>
                  <div id="agent-obs"></div>
                </aside>
              </div>
            </div>
          </section>
          <!-- 分享主界面（Sider = 媒体库入口，这里 = 分享记录列表） -->
          <section class="main-page" data-main="share">
            <div class="share-page">
              <header class="page-head">
                <span class="page-title">分享记录</span>
                <span class="page-hint">发布产物在「归档」页管理</span>
                <button id="media" type="button">媒体库</button>
              </header>
              <ul id="share-list-body" class="history-list share-list-main"></ul>
            </div>
          </section>
          <!-- 设置主界面（Sider = 分区导航，这里 = 设置分区） -->
          <section class="main-page" data-main="settings">
            <div class="settings-page" id="settings-main-area"></div>
          </section>
        </div>
      </div>
      <footer class="statusbar">
        <span id="status" class="status"></span>
        <span class="statusbar-right">
          <span id="save-state" class="save-state"></span>
          <span id="doc-path" class="statusbar-path"></span>
        </span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
