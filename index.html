<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTDoc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到编辑器</a>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
      <symbol id="i-sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
      </symbol>
    </svg>
    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="icon-btn" type="button" title="折叠侧边栏" aria-label="折叠侧边栏" aria-controls="sidebar" aria-expanded="true">
            <svg class="icon"><use href="#i-sidebar"></use></svg>
          </button>
          <div class="brand" id="brand">PTDoc</div>
          <div class="doc-meta">
            <span id="doc-title" class="doc-title">未命名</span>
            <span id="doc-source" class="doc-source" hidden></span>
          </div>
        </div>
        <div class="view-switch" role="tablist" aria-label="编辑视图">
          <button id="view-edit" type="button" role="tab" aria-selected="false" data-view="edit">编辑</button>
          <button id="view-split" type="button" role="tab" aria-selected="true" data-view="split" class="active">分栏</button>
          <button id="view-preview" type="button" role="tab" aria-selected="false" data-view="preview">预览</button>
        </div>
        <div class="actions">
          <div class="action-group">
            <button id="open-md" type="button">打开</button>
            <button id="upload-img" type="button">上传图片</button>
            <button id="media" type="button">媒体库</button>
          </div>
          <div class="action-group">
            <button id="share" class="btn-primary" type="button">生成分享版<span id="share-badge" class="share-badge" hidden></span></button>
            <button id="share-list" type="button">分享记录</button>
          </div>
          <div class="action-group action-secondary">
            <button id="toc-toggle" type="button">目录</button>
            <button id="snapshots" type="button">快照</button>
            <button id="history" type="button">历史</button>
          </div>
          <div class="action-group action-account">
            <button id="settings" type="button">设置</button>
            <button id="admin" type="button" hidden>账号</button>
            <span id="whoami" class="whoami" hidden></span>
            <button id="logout" type="button" hidden>退出</button>
          </div>
        </div>
        <input type="file" id="md-input" accept=".md,.markdown" hidden />
        <input type="file" id="img-input" accept="image/*" hidden />
        <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
      </header>
      <div class="workspace" id="workspace">
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-head">
            <input id="sidebar-search" type="search" placeholder="过滤文档…" aria-label="过滤文档" />
            <button id="sidebar-new" class="icon-btn" type="button" title="新建文档" aria-label="新建文档">
              <svg class="icon"><use href="#i-plus"></use></svg>
            </button>
            <button id="sidebar-import" class="icon-btn" type="button" title="导入文件夹" aria-label="导入文件夹">
              <svg class="icon"><use href="#i-folder"></use></svg>
            </button>
          </div>
          <nav id="sidebar-tree" class="sidebar-tree" aria-label="文档树"></nav>
        </aside>
        <div class="workspace-main">
          <section class="pane editor-pane">
            <textarea id="editor" spellcheck="false" placeholder="在这里写 Markdown，支持 ```mermaid 代码块…"></textarea>
          </section>
          <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical" aria-label="调整编辑与预览宽度"></div>
          <section class="pane preview-pane">
            <article id="preview" class="markdown-body"></article>
          </section>
        </div>
      </div>
      <footer class="statusbar">
        <span id="status" class="status"></span>
        <span id="doc-path" class="statusbar-path"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
