# 打 v* tag 时，复用 abrance/yoc 的 docker-publish-ghcr 自动构建并推送到 GHCR。
#
# 产出镜像：ghcr.io/abrance/ptdoc:<tag>（另有 <version>、<major>.<minor>、latest）
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0
#
# 如需自定义站点标题 / 默认文档（VITE_*），打开下方 build-args 并按需填写
# （不传时 src/config.ts 使用内置默认值，与仓库默认一致）。
name: Docker Publish GHCR

on:
  push:
    tags: ['v*']

# 权限沿 workflow_call 调用链只减不增：必须在此显式声明 packages: write，
# 被调用的 yoc docker-publish-ghcr 才被允许以该权限发布 GHCR。
permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    uses: abrance/yoc/.github/workflows/docker-publish-ghcr.yml@v1.0.0
    with:
      image-name: ${{ github.repository }}
      context: .
      file: build/Dockerfile
      tags: |
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
